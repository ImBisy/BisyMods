	# minecolonies.config.diseasemodifier.comment [Default: 5, min: 1, max: 100]
	diseasemodifier = 5
	# How long a citizen may fail to get any closer to where its job sent it before it is teleported there, in seconds. 0 = never teleport. [Default: 60, min: 0, max: 3600]
	stuckrescueseconds = 60
	# minecolonies.config.forceloadcolony.comment [Default: true]
	forceloadcolony = true
	# minecolonies.config.loadtime.comment [Default: 20, min: 1, max: 1440]
	loadtime = 20
	# How many building claims have to overlap on a chunk before the "Chunk Load Colony" option keeps it loaded. The higher this value, the fewer chunks will be loaded. 1 keeps every chunk a building stands on or reaches; it still does not cover claimed ground with no building on it - for that use "Keep All Claimed Chunks Loaded". [Default: 3, min: 1, max: 15]
	colonyloadstrictness = 3
	# Default answer for colonies nobody has decided about: keep every chunk the colony owns loaded and ticking, not only the ones its buildings stand on. This is what stops citizens out on claimed ground - fields, roads, mines, enclaves - from freezing and then vanishing when no player is near. It is not free: each of those chunks then runs entity AI, block entities and random ticks like a chunk a player is standing in, so a large town costs roughly as much as one extra player being online. Mobs still do not spawn out there, and nothing is rendered anywhere. This is only the default - a colony set with '/mc colony forceloadclaims <colony> on|off' keeps its own answer whatever this says, and '/mc colony forceloadclaims <colony> default' hands it back. Off by default; the "Chunk Load Colony" timer and the "Maximum force-loaded chunks" ceiling both still apply. [Default: false]
	forceloadallclaims = false
	# Hard ceiling, per colony, on how many chunks one colony may keep loaded while nobody is near it - colonies do not share it and cannot starve each other of tickets. Every one of them keeps a 5x5 block of chunks loaded and its own centre chunk ticking, so this is the real cost of the "Chunk Load Colony" and "Keep All Claimed Chunks Loaded" options. The cap only refuses new chunks, it never releases one the colony already holds; when it bites, the chunks nearest the town hall are the ones kept, and '/mc colony forceloadclaims' says so. Set to 0 for no limit. [Default: 1024, min: 0, max: 4096]
	maxforcedchunks = 1024
	# How far, in blocks, a building may stand from a Builder's hut and still be built. This is the number behind "There is no Builder close enough to work on this building!". It is measured in three dimensions, so a hut sunk deep into a mountainside can be out of range while one the same ground distance away on the flat is not. Upstream hardcodes 100; the default here is raised deliberately. Keep "Maximum pathfinding distance" at least as high, or a Builder will accept work it cannot walk to. A Builder's own hut, the Town Hall, and any hut assigned to a Builder by hand ignore this entirely. [Default: 2000, min: 16, max: 5000]
	maxbuilderdistance = 2000
	# Let a decoration's footprint cross the colony border. Placement otherwise demands that every chunk the blueprint touches belongs to the colony, which puts a wall or a road a chunk short of the border it wants to sit on. A decoration - anything whose anchor is neither a hut nor a plantation field - owns no ground and files no claim, so this costs the colony nothing and takes nothing from a neighbour. Huts and plantation fields are unchanged. The anchor block must still stand inside the colony, because the work order is filed with the colony the anchor is in. [Default: true]
	decorationsoutsidecolony = true
	# minecolonies.config.maxtreesize.comment [Default: 400, min: 1, max: 1000]
	maxtreesize = 400
	# minecolonies.config.nosupplyplacementrestrictions.comment [Default: false]
	nosupplyplacementrestrictions = false
	# minecolonies.config.skyraiders.comment [Default: false]
	skyraiders = false
	# Needs the Simple Planes mod. When it is installed, some pirate raids arrive aboard an unmanned transport that flies over the colony, drops the raiders by parachute and leaves. Turn this off to keep every raid on foot; nothing else changes, and colonies without Simple Planes are unaffected either way. [Default: true]
	airraids = true
	# Percentage of pirate raids that arrive by air rather than on foot, when air raids are enabled and Simple Planes is installed. 0 disables air raids as surely as turning them off; 100 makes every pirate raid an air drop. [Default: 25, min: 0, max: 100]
	airraidchance = 25
	# Needs the Simple Planes mod. Sounds the raid warning and alerts the guards when an aircraft the colony did not send comes near, or the moment a scripted attack run is ordered against anything the colony owns. [Default: true]
	aircraftwarnings = true
	# Largest farm field, in blocks of ground, that may be laid out while free mode is on for the colony. Any shape is allowed as long as width times depth stays at or below this. Colonies without free mode keep the normal limit of 11x11. [Default: 4096, min: 121, max: 1000000]
	freemodemaxfieldarea = 4096
	# How many field cells the farmer may till, sow or harvest from one spot before pausing, while free mode is on for the colony. The pause between cells is the farmer's whole working rhythm, so this divides it: 3 means one pause for every three cells instead of one each. Cells only join a batch if they are within this many blocks of the citizen and in plain sight of it. 1 is the ordinary behaviour, which is what colonies without free mode always get. [Default: 3, min: 1, max: 8]
	freemodefarmerbatchsize = 3
	# The farmer clears whatever it cannot till inside its field - stone, gravel, sand, anything - and lays ground down in its place, then tills that. It never touches water, lava or a waterlogged block. With free mode on for the colony the ground is conjured; otherwise the farmer requests dirt and waits for it. Turn this off to get the old behaviour, where a cell that cannot be tilled is silently skipped. [Default: true]
	farmerpreparesground = true
	# How far, in blocks, a hut may reach when it claims a field on its own. Measured horizontally from the hut to the nearest block the field covers. A hut also lets go of a field that has drifted outside this range, unless the field was assigned by hand or the hut is on manual assignment. Set to 0 for no limit, which is how it behaved before. [Default: 128, min: 0, max: 100000]
	maxfieldclaimdistance = 128
	# Cows, sheep, pigs, chickens, rabbits and stabled horses standing inside a herder hut are given that hut as their home, which is the same restriction vanilla puts on a leashed animal: they no longer wander out of it, and one that has been pushed, frightened or carried out walks back. Leash an animal and unleash it somewhere else to take it out of the hut for good. Turn this off for vanilla wandering. [Default: true]
	animalpencontainment = true
	# Extra blocks of roaming room beyond the herder hut's own footprint. Zero keeps the animals to exactly the ground the hut's blueprint covers; larger values let them graze around it. [Default: 4, min: 0, max: 64]
	animalpenslack = 4
	# An animal found this many blocks outside its herder hut is put back inside it rather than left to walk. This is the backstop for animals that cannot walk home at all - across water, down a ravine, taken away in a boat. Set to 0 to never move an animal by hand, at the price of eventually losing the ones that get stuck. [Default: 32, min: 0, max: 256]
	animalpenrecalldistance = 32
	# How many visitors a tavern may hold for each level it has been built to, so the default of 3 gives a level 1 tavern 3 and a level 5 tavern 15. Every visitor is a live entity walking around a loaded colony, costing roughly a third of what a citizen costs, so the maximum of 10 puts 50 people in a finished tavern for about the price of 17 extra citizens. Raising this on its own fills the tavern very slowly - lower the visitor interval as well. Set to 0 for no visitors and no recruitment at all. [Default: 3, min: 0, max: 10]
	visitorspertavernlevel = 3
	# Multiplies every wait between visitor arrivals: the delay before a new tavern's first visitor, the gap between arrivals after that, and the pause after a visitor is killed. Below 1 they come faster, above 1 slower. A tavern cannot produce more than one visitor per 25 seconds however low this is set, because that is how often the tavern is asked. [Default: 1.0, min: 0.05, max: 5.0]
	visitorintervalmodifier = 1.0
	# Citizens age one colony day per colony day and eventually die of old age, going through the same grave, undertaker and re-hiring machinery as any other death. Turning it on also changes reproduction: births no longer need a free bed, and their rate is driven by food, happiness, housing pressure and the growth research instead of by a fixed timer. OFF by default - it kills citizens in a colony you may have played for weeks, and there is no undo. Existing citizens are given a random age between nothing and half a lifespan the first dawn after it is switched on, so nobody dies on the day you enable it. [Default: false]
	generations = false
	# How long an adult citizen lives, in colony days, before living conditions are taken into account. A colony day is one in-game day of loaded colony, twenty real minutes; a colony nobody visits does not age. Each citizen gets a personal deviation of up to a quarter either way, so a cohort does not die together, and misery shortens a life by up to half while a very happy one lengthens it by a quarter. Deaths a day work out to population divided by this, so 100 puts a 30 citizen town at about one funeral every three days of play and the 250 ceiling at two and a half a day. [Default: 100, min: 7, max: 10000]
	generationslifespandays = 100
	# Multiplies the generational birth rate. The rate is derived from the death rate - population divided by lifespan - so 1.0 means a colony with neutral living conditions exactly replaces itself, and a well fed, happy, well housed one already sits near 1.8 without touching this. Raise it if your colony keeps shrinking, lower it if the school cannot keep up. Has no effect unless generations is on. [Default: 1.0, min: 0.1, max: 5.0]
	generationsbirthmodifier = 1.0

