	# How many blocks up and down a Guard looks for enemies. At the default of 3 a Knight does not notice a mob standing on a wall or a roof beside him; Archers on guard duty already look 28 blocks up. Raising this makes Guards fight more, and widens the entity search they run every four seconds. [Default: 12, min: 3, max: 64]
	guardverticalvision = 12
	# Whether Guards nod off while on duty, to be woken by a colleague. This happens by day as well as by night and costs a Guard roughly a tenth of his working time. Off means Guards never sleep. [Default: true]
	guardsfallasleep = true
