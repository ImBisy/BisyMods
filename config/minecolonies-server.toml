	# minecolonies.config.auditcraftingtags.comment [Default: false]
	auditcraftingtags = false
	# minecolonies.config.debuginventories.comment [Default: false]
	debuginventories = false
	# Logs every hit a cavalry horse takes, every cavalry horse death and every cavalry horse leaving a chunk, each with a stack trace. Off by default: in a fight this is several lines per second. [Default: false]
	cavalrydebuglog = false
	# minecolonies.config.blueprintbuildmode.comment [Default: false]
	blueprintbuildmode = false
	# minecolonies.config.pathNodeLimitMultiplier.comment [Default: 1.0, min: 1.0, max: 4.0]
	pathNodeLimitMultiplier = 1.0
	# minecolonies.config.minimumrailstopath.comment [Default: 8, min: 5, max: 100]
	minimumrailstopath = 8
	# Minimum number of consecutive water blocks for citizens to cross them by boat instead of swimming. [Default: 5, min: 2, max: 100]
	minimumwatertoboat = 5
	# How fast citizens steer a colony boat, in blocks per second, the same unit as the vanilla maxMinecartSpeed game rule. The boat travels 0.9 of this once the game's in-water drag is applied, so the default 6 crosses water at 5.4 blocks per second. Change it live with '/mc boatspeed'. [Default: 6.0, min: 2.0, max: 20.0]
	boatspeed = 6.0
	# How far, in blocks, a citizen may be ordered to walk in one go. An order beyond this is refused outright and the citizen is sent home, so an enclave further away than this can never be reached. Raising it does not make the pathfinder work harder on any single route - the node budget is the same at 3000 blocks as at 300 - but a route only succeeds at that range if it follows rails or open water; over broken ground the search runs out of nodes about 100 blocks from the start whatever the target is. Rails and water also need their chunks kept loaded the whole way. [Default: 2000, min: 100, max: 5000]
	maxpathfindingdistance = 2000
	# When a search finds a route to its destination, stop as soon as nothing left in the queue could beat that route, instead of expanding everything cheaper than it. On by default. Measured on a live colony it takes about 4% off the pathfinding thread, because most searches never reach their destination and a search that never arrives has no tail to cut; where citizens travel by rail or boat it is worth far more - 800 blocks of rail fell from 6223 search nodes to 16, 796 blocks of open water from 8301 to 30. Route quality was measured too: every test route came back identical, and the average length moved by -0.1%. Turn it off only if workers start taking visibly silly routes. [Default: true]
	stopsearchonarrival = true
	# How many worker threads the pathfinding pool runs. The default is 1, the size the pool was hard-coded to before this setting existed, so leaving it alone changes nothing. Read once, when the pool is first built, so a change here takes effect on the next server start; '/mc debug maxpool' changes the size of a running pool instead, without losing the searches already on it. Raising it lets several searches run at once on a server whose citizens are waiting on the queue - /mc pathstats reports that wait - but the searches read the live world, and the block storage they read is not written for concurrent readers. That is already true at one thread; more threads widen the window. Try it on a server you can watch. [Default: 1, min: 1, max: 8]
	pathfindingthreads = 1

